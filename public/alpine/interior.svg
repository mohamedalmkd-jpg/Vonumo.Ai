<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2119"/><stop offset="1" stop-color="#4a3826"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6b7c"/><stop offset="1" stop-color="#c3ccd5"/></linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1f4f7"/><stop offset="1" stop-color="#9aa7b4"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b4f33"/><stop offset="1" stop-color="#2b1f15"/></linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd59a" stop-opacity=".55"/><stop offset="1" stop-color="#ffd59a" stop-opacity="0"/></radialGradient>
    <radialGradient id="fire" cx=".5" cy="1" r=".8"><stop offset="0" stop-color="#ffb057"/><stop offset=".5" stop-color="#d0601f" stop-opacity=".7"/><stop offset="1" stop-color="#d0601f" stop-opacity="0"/></radialGradient>
    <linearGradient id="vign" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b0806" stop-opacity=".6"/><stop offset=".3" stop-color="#0b0806" stop-opacity="0"/><stop offset=".7" stop-color="#0b0806" stop-opacity="0"/><stop offset="1" stop-color="#0b0806" stop-opacity=".6"/></linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .07 0"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="win"><rect x="560" y="170" width="800" height="560"/></clipPath>
  </defs>
  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- Holzlamellen -->
  <g stroke="#1d1712" stroke-width="2" opacity=".5">
    <path d="M80 0V800M160 0V800M240 0V800M320 0V800M400 0V800M480 0V800M1440 0V800M1520 0V800M1600 0V800M1680 0V800M1760 0V800M1840 0V800"/>
  </g>
  <!-- Panoramafenster -->
  <g clip-path="url(#win)">
    <rect x="560" y="170" width="800" height="560" fill="url(#sky)"/>
    <path d="M560 560 L700 430 L780 470 L900 330 L1000 420 L1120 360 L1230 450 L1360 400 L1360 730 L560 730Z" fill="url(#peak)"/>
    <path d="M900 330 L930 380 L915 395 L950 430 M1120 360 L1150 400" stroke="#ffffff" stroke-width="3" fill="none" opacity=".6"/>
    <path d="M560 650 C800 620 1100 640 1360 610 L1360 730 L560 730Z" fill="#e9edf1"/>
  </g>
  <rect x="560" y="170" width="800" height="560" fill="none" stroke="#14100c" stroke-width="14"/>
  <line x1="960" y1="170" x2="960" y2="730" stroke="#14100c" stroke-width="8"/>
  <!-- Boden -->
  <rect y="800" width="1920" height="280" fill="url(#floor)"/>
  <rect y="796" width="1920" height="6" fill="#1b140e"/>
  <!-- Fensterreflex auf Boden -->
  <path d="M600 802 L1320 802 L1500 1080 L420 1080Z" fill="#dfe6ee" opacity=".09"/>
  <!-- Kamin links -->
  <rect x="150" y="520" width="300" height="280" fill="#1a1612"/>
  <rect x="190" y="640" width="220" height="120" fill="#0d0a08"/>
  <ellipse cx="300" cy="760" rx="120" ry="70" fill="url(#fire)"/>
  <ellipse cx="300" cy="720" rx="260" ry="200" fill="#ff9a4a" opacity=".12" filter="url(#blur)"/>
  <!-- Sofa -->
  <g>
    <rect x="620" y="760" width="680" height="80" rx="10" fill="#d8cfc2"/>
    <rect x="620" y="720" width="680" height="54" rx="12" fill="#e6ded2"/>
    <rect x="640" y="840" width="12" height="20" fill="#14100c"/><rect x="1268" y="840" width="12" height="20" fill="#14100c"/>
    <rect x="700" y="704" width="110" height="40" rx="10" fill="#b8865a"/>
  </g>
  <!-- Couchtisch -->
  <rect x="820" y="900" width="300" height="16" fill="#14100c"/>
  <rect x="840" y="916" width="10" height="50" fill="#14100c"/><rect x="1090" y="916" width="10" height="50" fill="#14100c"/>
  <!-- Pendelleuchte -->
  <line x1="1560" y1="0" x2="1560" y2="420" stroke="#0e0b08" stroke-width="3"/>
  <path d="M1510 420 L1610 420 L1590 380 L1530 380Z" fill="#0e0b08"/>
  <ellipse cx="1560" cy="470" rx="260" ry="200" fill="url(#lamp)"/>
  <!-- Sessel rechts -->
  <path d="M1460 820 L1460 720 Q1460 690 1490 690 L1640 690 Q1670 690 1670 720 L1670 820Z" fill="#3b2c20"/>
  <rect y="0" width="1920" height="1080" fill="url(#vign)"/>
  <rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
